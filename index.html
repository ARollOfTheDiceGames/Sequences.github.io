
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sequences</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }

        .game {
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .sequence {
            font-size: 24px;
            font-weight: bold;
            margin: 35px 0;
        }

        input {
            padding: 12px;
            width: 150px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 6px;
            text-align: center;
        }

        button {
            display: block;
            margin: 20px auto;
            padding: 12px 25px;
            background: #222;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .feedback {
            font-weight: bold;
            margin-top: 20px;
        }

        .correct {
            color: green;
        }

        .incorrect {
            color: red;
        }
    </style>
</head>

<body>

    <div class="game">

        <h1>Sequences</h1>
        <h3>Sequences is a daily puzzle game.</h3>
        <p>You must find the correct next anything in the sequence.</p>
        <p>Sequence #1</p>

        <p>Enter your answer to the sequence below!</p>

        <form id="quizForm">

            <div class="sequence">
                1, 2, 3, 4, 5, 6, 7, 8, 9, ...
            </div>

            <input
                type="text"
                id="answer"
                placeholder="Your answer"
                autocomplete="off"
                required
            >

            <button type="submit">Submit Answer</button>

            <p id="feedback" class="feedback" aria-live="polite"></p>

        </form>

    </div>

    <script>
        const correctAnswer = "10";

        document.getElementById("quizForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const userAnswer = document
                    .getElementById("answer")
                    .value.trim();

                const feedback = document.getElementById("feedback");

                if (userAnswer === correctAnswer) {

                    feedback.textContent = "✓ Correct! Great job!";
                    feedback.className = "feedback correct";

                } else {

                    feedback.textContent = "✗ Incorrect. Try again!";
                    feedback.className = "feedback incorrect";

                }

            });
    </script>

</body>
</html>
